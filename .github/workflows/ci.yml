# 全仓唯一的 CI 检查：跑统一测试入口。
#
# 入口刻意只有一条命令——在这里逐个目录抄一遍跑法，等于入口统一了、CI 又
# 分叉一次。为什么必须逐目录 discover（根级 discover 会得到 0 个测试）是已
# 接受决策，见 docs/adr/0003 § D6 与 docs/agents/testing.md，此处不复述。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 跑全仓测试
        run: python tools/run_tests.py
